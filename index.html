<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>美業會員管理系統</title>
  <style>
    :root {
      --bg-dark: #050505; --card-bg: #121212;
      --gold-light: #f1c40f; --gold-dark: #7a5c0d;
      --text-main: #e0e0e0; --emerald: #00ff88; --ruby: #ff4d4d;
    }
    body { font-family: sans-serif; background: var(--bg-dark); color: var(--text-main); padding: 15px; display: flex; flex-direction: column; align-items: center; }
    .container { width: 100%; max-width: 450px; background: var(--card-bg); padding: 25px; border-radius: 24px; border: 1px solid var(--gold-dark); box-shadow: 0 0 20px rgba(122, 92, 13, 0.2); }
    h1, h2 { color: var(--gold-light); text-align: center; }
    label { display: block; margin-top: 12px; font-size: 0.85rem; color: #888; }
    input, select { width: 100%; padding: 12px; margin-top: 5px; background: #1a1a1a; border: 1px solid #333; border-radius: 10px; color: #fff; box-sizing: border-box; }
    .btn { width: 100%; padding: 16px; border-radius: 14px; border: none; font-weight: bold; background: var(--gold-dark); color: #000; margin-top: 20px; cursor: pointer; transition: 0.3s; }
    .btn:active { transform: scale(0.98); background: var(--gold-light); }
    .member-card { background: #1a1a1a; padding: 15px; border-radius: 15px; margin-top: 15px; border-left: 5px solid var(--gold-dark); position: relative; }
    .rank-badge { position: absolute; right: 15px; top: 15px; background: var(--gold-light); color: #000; padding: 2px 8px; border-radius: 5px; font-size: 0.7rem; font-weight: bold; }
    .balance-tag { font-size: 1.2rem; font-weight: bold; color: var(--emerald); }
    .status-msg { position: fixed; top: 10px; background: var(--emerald); color: #000; padding: 8px 20px; border-radius: 20px; display: none; z-index: 100; }
  </style>
</head>
<body>

<div id="status" class="status-msg">同步成功</div>

<div class="container">
  <h1>尊榮會員管理</h1>
  
  <form id="memberForm">
    <input type="hidden" id="memberId">
    <label>會員姓名</label>
    <input type="text" id="name" placeholder="輸入姓名" required>
    
    <label>會員等級</label>
    <select id="level">
      <option value="VIP 尊爵">VIP 尊爵</option>
      <option value="白金金鑽">白金金鑽</option>
      <option value="普通會員">普通會員</option>
    </select>

    <div style="display: flex; gap: 10px; margin-top: 10px; background: #222; padding: 10px; border-radius: 10px;">
      <label style="margin:0; color:#fff;"><input type="radio" name="transType" value="deposit" checked> 儲值</label>
      <label style="margin:0; color:#fff;"><input type="radio" name="transType" value="spend"> 消費扣款</label>
    </div>

    <label>金額</label>
    <input type="number" id="amount" value="0">
    
    <label>項目說明 (如：洗剪、儲值五千送一千)</label>
    <input type="text" id="note" placeholder="備註事項">

    <button type="button" class="btn" onclick="handleSave()">✨ 確認提交資料</button>
  </form>

  <hr style="border:0; border-top:1px solid #333; margin: 30px 0;">
  <h2>📊 尊榮榜 (按等級與餘額排序)</h2>
  <div id="memberList"></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getDatabase, ref, push, onValue, update, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyC0hBN9TH3UJSOsx5XVyQ08f_2RUckvXYU",
    authDomain: "holyhairsalon-f73bf.firebaseapp.com",
    databaseURL: "https://holyhairsalon-f73bf-default-rtdb.firebaseio.com",
    projectId: "holyhairsalon-f73bf",
    storageBucket: "holyhairsalon-f73bf.firebasestorage.app",
    messagingSenderId: "960169055224",
    appId: "1:960169055224:web:4f8a45c0d3e31a93bf3c0d"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  window.handleSave = async () => {
    const id = document.getElementById('memberId').value;
    const name = document.getElementById('name').value;
    const level = document.getElementById('level').value;
    const amount = Number(document.getElementById('amount').value);
    const note = document.getElementById('note').value;
    const type = document.querySelector('input[name="transType"]:checked').value;

    if (!name) return alert("請輸入姓名");

    try {
      let memberRef;
      let currentData = { totalDeposit: 0, totalSpend: 0, points: 0 };

      if (id) {
        memberRef = ref(db, 'members/' + id);
        const snap = await get(memberRef);
        if (snap.exists()) currentData = snap.val();
      } else {
        memberRef = push(ref(db, 'members'));
      }

      // 運算邏輯：儲值加總，消費扣款
      let newDeposit = Number(currentData.totalDeposit || 0);
      let newSpend = Number(currentData.totalSpend || 0);

      if (type === 'deposit') {
        newDeposit += amount;
      } else {
        newSpend += amount;
      }

      await update(memberRef, {
        name, level,
        totalDeposit: newDeposit,
        totalSpend: newSpend,
        balance: newDeposit - newSpend,
        lastNote: note || (type === 'deposit' ? "儲值" : "消費"),
        lastUpdate: Date.now()
      });

      document.getElementById('memberForm').reset();
      document.getElementById('memberId').value = '';
      showStatus("💰 帳目已更新");
    } catch (e) { alert("出錯了：" + e.message); }
  };

  onValue(ref(db, 'members'), (snapshot) => {
    const data = snapshot.val();
    const listDiv = document.getElementById('memberList');
    listDiv.innerHTML = '';
    if (!data) return;

    // 排序權重：等級優先，餘額第二
    const weights = { "VIP 尊爵": 3, "白金金鑽": 2, "普通會員": 1 };
    const sorted = Object.entries(data).sort(([,a], [,b]) => {
      if (weights[b.level] !== weights[a.level]) return weights[b.level] - weights[a.level];
      return b.balance - a.balance;
    });

    sorted.forEach(([id, m], index) => {
      const card = document.createElement('div');
      card.className = 'member-card';
      card.innerHTML = `
        <div class="rank-badge">NO.${index + 1}</div>
        <div style="color:var(--gold-light); font-weight:bold;">${m.name} <span style="font-size:0.7rem; color:#666;">| ${m.level}</span></div>
        <div style="margin-top:10px;">
          <span style="font-size:0.8rem; color:#888;">當前餘額</span><br>
          <span class="balance-tag">$${m.balance || 0}</span>
        </div>
        <div style="font-size:0.75rem; color:#555; margin-top:5px;">
          總儲值: $${m.totalDeposit || 0} / 總消費: $${m.totalSpend || 0}<br>
          最近紀錄: ${m.lastNote || '無'}
        </div>
        <button onclick="editMember('${id}', '${m.name}', '${m.level}')" style="margin-top:10px; background:none; border:1px solid #333; color:#888; width:100%; cursor:pointer; padding:5px; border-radius:5px;">選取此會員進行操作</button>
      `;
      listDiv.appendChild(card);
    });
  });

  window.editMember = (id, name, level) => {
    document.getElementById('memberId').value = id;
    document.getElementById('name').value = name;
    document.getElementById('level').value = level;
    document.getElementById('amount').value = 0;
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  function showStatus(msg) {
    const s = document.getElementById('status');
    s.innerText = msg; s.style.display = 'block';
    setTimeout(() => s.style.display = 'none', 3000);
  }
</script>
</body>
</html>

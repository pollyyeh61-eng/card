<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>美業尊榮管理系統</title>
  <style>
    :root {
      --bg-dark: #050505; --card-bg: #121212;
      --gold-light: #f1c40f; --gold-dark: #7a5c0d;
      --text-main: #e0e0e0; 
      --btn-save: #00ff88; /* 翡翠綠 */
      --btn-edit: #00d4ff; /* 寶石藍 */
      --btn-hover-glow: rgba(241, 196, 15, 0.4);
    }
    
    body { 
      font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; 
      background: var(--bg-dark); color: var(--text-main); 
      padding: 15px; display: flex; flex-direction: column; align-items: center; 
    }
    
    /* 呼吸感容器 */
    .container { 
      width: 100%; max-width: 450px; background: var(--card-bg); 
      padding: 25px; border-radius: 28px; border: 1px solid var(--gold-dark);
      box-shadow: 0 0 20px rgba(0, 0, 0, 1);
      transition: all 0.5s ease;
    }
    .container:hover {
      box-shadow: 0 0 30px rgba(122, 92, 13, 0.3);
      border-color: var(--gold-light);
    }
    
    h1 { color: var(--gold-light); text-align: center; letter-spacing: 2px; text-shadow: 0 0 10px rgba(241, 196, 15, 0.3); }
    
    label { display: block; margin-top: 15px; font-size: 0.8rem; color: #888; text-transform: uppercase; }
    
    input, select { 
      width: 100%; padding: 14px; margin-top: 8px; background: #1a1a1a; 
      border: 1px solid #333; border-radius: 12px; color: #fff; box-sizing: border-box; 
      transition: all 0.3s;
    }
    input:focus { border-color: var(--gold-light); outline: none; box-shadow: 0 0 10px rgba(241, 196, 15, 0.2); }

    /* 單選按鈕奢華設計 */
    .transaction-type { display: flex; gap: 10px; margin-top: 20px; }
    .transaction-type label { 
      flex: 1; margin: 0; padding: 12px; background: #222; border-radius: 10px; 
      display: flex; align-items: center; justify-content: center; cursor: pointer; border: 1px solid transparent;
    }
    .transaction-type input { display: none; }
    .transaction-type label:has(input:checked) { border-color: var(--gold-light); background: #2d2d2d; color: var(--gold-light); }

    /* 會呼吸的儲存按鈕 - 翡翠綠光譜 */
    .btn-save { 
      width: 100%; padding: 18px; border-radius: 16px; border: none; font-weight: bold; 
      background: linear-gradient(135deg, #008f4f, #00ff88); color: #000; 
      margin-top: 25px; cursor: pointer; font-size: 1.1rem;
      box-shadow: 0 4px 15px rgba(0, 255, 136, 0.2);
      animation: breatheGreen 3s infinite ease-in-out;
    }
    @keyframes breatheGreen {
      0%, 100% { box-shadow: 0 0 10px rgba(0, 255, 136, 0.2); transform: scale(1); }
      50% { box-shadow: 0 0 25px rgba(0, 255, 136, 0.5); transform: scale(0.99); }
    }

    /* 會員卡片 - 呼吸與懸停色彩 */
    .member-card { 
      background: #1a1a1a; padding: 20px; border-radius: 20px; margin-top: 18px; 
      border: 1px solid #333; position: relative; overflow: hidden;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .member-card:hover { 
      transform: translateY(-5px); 
      border-color: var(--gold-light);
      box-shadow: 0 10px 25px rgba(241, 196, 15, 0.15);
    }
    
    .rank-badge { 
      position: absolute; right: 0; top: 0; background: var(--gold-light); 
      color: #000; padding: 5px 12px; border-radius: 0 0 0 15px; font-size: 0.75rem; font-weight: 900; 
    }

    .balance-tag { font-size: 1.6rem; font-weight: 800; color: var(--gold-light); letter-spacing: -1px; }

    /* 選取按鈕 - 寶石藍光譜 */
    .btn-edit {
      margin-top: 15px; background: transparent; border: 1px solid #444; color: #aaa; 
      width: 100%; cursor: pointer; padding: 10px; border-radius: 12px; font-size: 0.85rem;
      transition: all 0.3s;
    }
    .btn-edit:hover { 
      background: rgba(0, 212, 255, 0.1); border-color: var(--btn-edit); color: var(--btn-edit);
      box-shadow: 0 0 15px rgba(0, 212, 255, 0.3);
    }

    .status-msg { 
      position: fixed; top: 20px; background: var(--btn-save); color: #000; 
      padding: 12px 30px; border-radius: 30px; display: none; z-index: 100; font-weight: bold;
      box-shadow: 0 5px 20px rgba(0, 255, 136, 0.4);
    }
  </style>
</head>
<body>

<div id="status" class="status-msg">已實時同步雲端</div>

<div class="container">
  <h1>尊榮會員管理系統</h1>
  
  <form id="memberForm">
    <input type="hidden" id="memberId">
    
    <label>尊貴會員姓名</label>
    <input type="text" id="name" placeholder="請輸入姓名" required>
    
    <label>專屬會員等級</label>
    <select id="level">
      <option value="VIP 尊爵">VIP 尊爵 (權重最高)</option>
      <option value="白金金鑽">白金金鑽</option>
      <option value="普通會員">普通會員</option>
    </select>

    <div class="transaction-type">
      <label><input type="radio" name="transType" value="deposit" checked> 💰 儲值</label>
      <label><input type="radio" name="transType" value="spend"> ✂️ 消費</label>
    </div>

    <label>交易金額</label>
    <input type="number" id="amount" value="0" onclick="this.select()">
    
    <label>備註紀錄</label>
    <input type="text" id="note" placeholder="如：儲值、護髮、產品購買">

    <button type="button" class="btn-save" onclick="handleSave()">✨ 提交並更新數據庫</button>
  </form>

  <hr style="border:0; border-top:1px solid #222; margin: 35px 0;">
  <h2>📊 實時尊榮排行榜</h2>
  <div id="memberList"></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getDatabase, ref, push, onValue, update, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyC0hBN9TH3UJSOsx5XVyQ08f_2RUckvXYU",
    authDomain: "holyhairsalon-f73bf.firebaseapp.com",
    databaseURL: "https://holyhairsalon-f73bf-default-rtdb.firebaseio.com",
    projectId: "holyhairsalon-f73bf",
    storageBucket: "holyhairsalon-f73bf.firebasestorage.app",
    messagingSenderId: "960169055224",
    appId: "1:960169055224:web:4f8a45c0d3e31a93bf3c0d"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const listDiv = document.getElementById('memberList');

  // 本地快取
  const cachedData = localStorage.getItem('hairSalonCache');
  if (cachedData) renderList(JSON.parse(cachedData));

  window.handleSave = async () => {
    const id = document.getElementById('memberId').value;
    const name = document.getElementById('name').value;
    const level = document.getElementById('level').value;
    const amount = Number(document.getElementById('amount').value);
    const note = document.getElementById('note').value;
    const type = document.querySelector('input[name="transType"]:checked').value;

    if (!name) return alert("請輸入姓名");

    try {
      let memberRef;
      let currentData = { totalDeposit: 0, totalSpend: 0 };

      if (id) {
        memberRef = ref(db, 'members/' + id);
        const snap = await get(memberRef);
        if (snap.exists()) currentData = snap.val();
      } else {
        memberRef = push(ref(db, 'members'));
      }

      let newDep = Number(currentData.totalDeposit || 0);
      let newSpe = Number(currentData.totalSpend || 0);
      type === 'deposit' ? newDep += amount : newSpe += amount;

      await update(memberRef, {
        name, level,
        totalDeposit: newDep, totalSpend: newSpe,
        balance: newDep - newSpe,
        lastNote: note || (type === 'deposit' ? "儲值" : "消費"),
        lastUpdate: Date.now()
      });

      document.getElementById('memberForm').reset();
      document.getElementById('memberId').value = '';
      showStatus("✅ 數據更新成功");
    } catch (e) { alert("錯誤：" + e.message); }
  };

  onValue(ref(db, 'members'), (snapshot) => {
    const data = snapshot.val();
    if (!data) return;
    localStorage.setItem('hairSalonCache', JSON.stringify(data));
    renderList(data);
  });

  function renderList(data) {
    listDiv.innerHTML = '';
    const weights = { "VIP 尊爵": 3, "白金金鑽": 2, "普通會員": 1 };
    const sorted = Object.entries(data).sort(([,a], [,b]) => {
      if (weights[b.level] !== weights[a.level]) return weights[b.level] - weights[a.level];
      return (b.balance || 0) - (a.balance || 0);
    });

    sorted.forEach(([id, m], index) => {
      const card = document.createElement('div');
      card.className = 'member-card';
      card.innerHTML = `
        <div class="rank-badge">RANK ${index + 1}</div>
        <div style="color:var(--gold-light); font-weight:bold; font-size:1.2rem;">${m.name}</div>
        <div style="font-size:0.75rem; color:#666; margin-top:4px;">${m.level}</div>
        <div style="margin-top:15px;">
          <span style="font-size:0.8rem; color:#888;">可用餘額</span><br>
          <span class="balance-tag">$${m.balance || 0}</span>
        </div>
        <div style="font-size:0.7rem; color:#555; margin-top:10px; border-top:1px solid #222; padding-top:10px;">
          異動備註：${m.lastNote || '無'}<br>
          <span style="color:#444;">更新時間：${new Date(m.lastUpdate).toLocaleString()}</span>
        </div>
        <button onclick="editMember('${id}', '${m.name}', '${m.level}')" class="btn-edit">
          選取此會員進行操作
        </button>
      `;
      listDiv.appendChild(card);
    });
  }

  window.editMember = (id, name, level) => {
    document.getElementById('memberId').value = id;
    document.getElementById('name').value = name;
    document.getElementById('level').value = level;
    document.getElementById('amount').value = 0;
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  function showStatus(msg) {
    const s = document.getElementById('status');
    s.innerText = msg; s.style.display = 'block';
    setTimeout(() => s.style.display = 'none', 3000);
  }
</script>
</body>
</html>

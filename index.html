<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>尊榮管理 - 手機建檔版</title>
  <style>
    :root {
      --bg-dark: #050505; --card-bg: #121212;
      --gold-light: #f1c40f; --gold-dark: #7a5c0d;
      --text-main: #e0e0e0; 
      --btn-save: #00ff88; --btn-edit: #00d4ff; --btn-delete: #ff4d4d;
    }
    body { font-family: 'PingFang TC', sans-serif; background: var(--bg-dark); color: var(--text-main); padding: 15px; display: flex; flex-direction: column; align-items: center; margin: 0; }
    .container { width: 100%; max-width: 450px; background: var(--card-bg); padding: 25px; border-radius: 28px; border: 1px solid var(--gold-dark); box-shadow: 0 0 20px #000; box-sizing: border-box; }
    h1 { color: var(--gold-light); text-align: center; letter-spacing: 2px; }
    label { display: block; margin-top: 15px; font-size: 0.8rem; color: #888; }
    input, select { width: 100%; padding: 14px; margin-top: 8px; background: #1a1a1a; border: 1px solid #333; border-radius: 12px; color: #fff; box-sizing: border-box; font-size: 1rem; }
    
    .transaction-type { display: flex; gap: 10px; margin-top: 20px; }
    .transaction-type label { flex: 1; padding: 12px; background: #222; border-radius: 10px; text-align: center; cursor: pointer; border: 1px solid transparent; transition: 0.3s; }
    .transaction-type input { display: none; }
    .transaction-type label:has(input:checked) { border-color: var(--gold-light); color: var(--gold-light); background: #2d2d2d; }
    
    .btn-save { width: 100%; padding: 18px; border-radius: 16px; border: none; font-weight: bold; background: linear-gradient(135deg, #008f4f, #00ff88); margin-top: 25px; cursor: pointer; font-size: 1.1rem; box-shadow: 0 4px 15px rgba(0, 255, 136, 0.3); }

    .member-card { background: #1a1a1a; border-radius: 20px; margin-top: 18px; border: 1px solid #333; overflow: hidden; position: relative; }
    .card-header { padding: 20px; cursor: pointer; }
    .rank-badge { position: absolute; right: 0; top: 0; background: var(--gold-light); color: #000; padding: 5px 12px; border-radius: 0 0 0 15px; font-size: 0.7rem; font-weight: 900; }
    .balance-tag { font-size: 1.6rem; font-weight: 800; color: var(--gold-light); }
    
    .drawer { max-height: 0; overflow: hidden; transition: max-height 0.4s ease-out; background: #151515; }
    .drawer.open { max-height: 1200px; border-top: 1px solid #333; padding: 15px; }
    
    .history-item { padding: 12px; border-bottom: 1px solid #222; font-size: 0.85rem; cursor: pointer; border-radius: 8px; }
    .history-item-top { display: flex; justify-content: space-between; align-items: center; }
    
    .detail-box { display: none; background: #000; margin-top: 8px; padding: 10px; border-radius: 8px; border-left: 3px solid var(--gold-light); font-size: 0.75rem; color: #aaa; line-height: 1.5; }
    .detail-box.show { display: block; }

    .btn-group { display: flex; gap: 8px; padding-top: 15px; }
    .btn-action { flex: 1; padding: 10px; border-radius: 10px; border: 1px solid #444; background: transparent; color: #888; cursor: pointer; }
    .status-msg { position: fixed; top: 20px; background: var(--btn-save); color: #000; padding: 10px 30px; border-radius: 30px; display: none; z-index: 100; font-weight: bold; }
  </style>
</head>
<body>

<div id="status" class="status-msg">同步成功</div>

<div class="container">
  <h1>尊榮管理系統</h1>
  <form id="memberForm">
    <input type="hidden" id="memberId">
    
    <label>手機號碼 (用於建立或搜尋檔案)</label>
    <input type="tel" id="phone" placeholder="輸入手機號碼..." oninput="autoMatchMember()" autocomplete="off">
    
    <label>會員姓名</label>
    <input type="text" id="name" placeholder="輸入姓名..." oninput="autoMatchMember()" required autocomplete="off">
    
    <label>會員等級</label>
    <select id="level" onchange="autoFillAmount()">
      <option value="普通會員">普通會員</option>
      <option value="VIP 尊爵">VIP 尊爵</option>
      <option value="白金金鑽">白金金鑽</option>
      <option value="黃金銀鑽">黃金銀鑽</option>
      <option value="白銀銅鑽">白銀銅鑽</option>
    </select>

    <div class="transaction-type">
      <label><input type="radio" name="transType" value="deposit" checked> 💰 儲值</label>
      <label><input type="radio" name="transType" value="spend"> ✂️ 消費</label>
    </div>

    <label>本次金額</label>
    <input type="number" id="amount" value="0" onclick="this.select()">
    
    <label>備註 (項目說明)</label>
    <input type="text" id="note" placeholder="項目說明">
    
    <button type="button" class="btn-save" onclick="handleSave()">✨ 建立/提交數據</button>
  </form>

  <hr style="border:0; border-top:1px solid #222; margin: 30px 0;">
  <h2>📊 實時排行與檔案</h2>
  <div id="memberList"></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getDatabase, ref, push, onValue, update, get, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyC0hBN9TH3UJSOsx5XVyQ08f_2RUckvXYU",
    authDomain: "holyhairsalon-f73bf.firebaseapp.com",
    databaseURL: "https://holyhairsalon-f73bf-default-rtdb.firebaseio.com",
    projectId: "holyhairsalon-f73bf",
    storageBucket: "holyhairsalon-f73bf.firebasestorage.app",
    messagingSenderId: "960169055224",
    appId: "1:960169055224:web:4f8a45c0d3e31a93bf3c0d"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  let globalMembers = {};

  // 1. 智慧匹配邏輯 (姓名或手機)
  window.autoMatchMember = () => {
    const inputPhone = document.getElementById('phone').value.trim();
    const inputName = document.getElementById('name').value.trim();
    
    // 優先匹配手機，其次姓名
    const matched = Object.entries(globalMembers).find(([id, m]) => 
      (inputPhone && m.phone === inputPhone) || (inputName && m.name === inputName)
    );

    if (matched) {
      const [id, data] = matched;
      document.getElementById('memberId').value = id;
      document.getElementById('name').value = data.name;
      document.getElementById('phone').value = data.phone || "";
      document.getElementById('level').value = data.level;
    } else {
      document.getElementById('memberId').value = "";
    }
  };

  window.autoFillAmount = () => {
    const prices = { "VIP 尊爵": 100000, "白金金鑽": 50000, "黃金銀鑽": 20000, "白銀銅鑽": 10000, "普通會員": 0 };
    document.getElementById('amount').value = prices[document.getElementById('level').value] || 0;
  };

  window.handleSave = async () => {
    const id = document.getElementById('memberId').value;
    const name = document.getElementById('name').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const level = document.getElementById('level').value;
    const amount = Number(document.getElementById('amount').value);
    const note = document.getElementById('note').value || "無備註";
    const type = document.querySelector('input[name="transType"]:checked').value;
    
    if (!name || !phone) return alert("請務必輸入「姓名」與「手機號碼」以便建檔！");

    const dateFull = new Date().toLocaleString('zh-TW', {hour12:false});
    const dateShort = dateFull.split(' ')[0];

    try {
      let memberRef, currentData = { totalDeposit: 0, totalSpend: 0, history: [] };
      if (id) {
        memberRef = ref(db, 'members/' + id);
        const snap = await get(memberRef);
        if (snap.exists()) currentData = snap.val();
      } else {
        memberRef = push(ref(db, 'members'));
      }

      const newDep = type === 'deposit' ? (currentData.totalDeposit || 0) + amount : (currentData.totalDeposit || 0);
      const newSpe = type === 'spend' ? (currentData.totalSpend || 0) + amount : (currentData.totalSpend || 0);
      const newBalance = newDep - newSpe;

      const newHistory = currentData.history || [];
      newHistory.unshift({ date: dateShort, fullTime: dateFull, type: type==='deposit'?'儲值':'消費', amount, note, afterBalance: newBalance });

      await update(memberRef, {
        name, phone, level, totalDeposit: newDep, totalSpend: newSpe, balance: newBalance,
        history: newHistory.slice(0, 50), lastUpdate: Date.now()
      });

      document.getElementById('memberForm').reset();
      document.getElementById('memberId').value = '';
      showStatus("✅ 會員檔案已同步");
    } catch (e) { alert("系統錯誤，請檢查網路！"); }
  };

  onValue(ref(db, 'members'), (snapshot) => {
    globalMembers = snapshot.val() || {};
    const listDiv = document.getElementById('memberList');
    listDiv.innerHTML = '';
    const weights = { "VIP 尊爵": 5, "白金金鑽": 4, "黃金銀鑽": 3, "白銀銅鑽": 2, "普通會員": 1 };
    const sorted = Object.entries(globalMembers).sort(([,a], [,b]) => weights[b.level] - weights[a.level] || (b.balance - a.balance));

    sorted.forEach(([id, m], index) => {
      const card = document.createElement('div');
      card.className = 'member-card';
      card.innerHTML = `
        <div class="card-header" onclick="toggleDrawer('${id}')">
          <div class="rank-badge">RANK ${index + 1}</div>
          <div style="color:var(--gold-light); font-weight:bold;">${m.name} <span style="font-size:0.75rem; color:#666; font-weight:normal;">| ${m.level}</span></div>
          <div style="margin-top:5px; font-size:0.8rem; color:#888;">📱 ${m.phone}</div>
          <div style="margin-top:10px;"><span style="font-size:0.8rem; color:#888;">可用餘額</span><br><span class="balance-tag">$${m.balance || 0}</span></div>
        </div>
        <div class="drawer" id="drawer-${id}">
          <div style="font-size:0.85rem; color:var(--gold-light); margin-bottom:12px; font-weight:bold;">📜 歷史交易 (點擊看備註)</div>
          ${(m.history || []).map((h, i) => `
            <div class="history-item" onclick="toggleDetail('${id}-${i}', event)">
              <div class="history-item-top">
                <span>${h.date} <b style="color:${h.type==='儲值'?'#00ff88':'#ff4d4d'}">${h.type}</b></span>
                <span>$${h.amount} ➔ $${h.afterBalance}</span>
              </div>
              <div class="detail-box" id="detail-${id}-${i}">
                <div style="color:var(--gold-light);">🕒 時間：${h.fullTime}</div>
                <div>📝 項目：${h.note}</div>
              </div>
            </div>
          `).join('')}
          <div class="btn-group">
            <button class="btn-action" onclick="editMember('${id}')">選取</button>
            <button class="btn-action" onclick="deleteMember('${id}','${m.name}')" style="color:#ff4d4d">刪除</button>
          </div>
        </div>
      `;
      listDiv.appendChild(card);
    });
  });

  window.toggleDrawer = (id) => document.getElementById(`drawer-${id}`).classList.toggle('open');
  window.toggleDetail = (detailId, event) => { event.stopPropagation(); document.getElementById(`detail-${detailId}`).classList.toggle('show'); };
  window.editMember = (id) => {
    const m = globalMembers[id];
    document.getElementById('memberId').value = id;
    document.getElementById('name').value = m.name;
    document.getElementById('phone').value = m.phone || "";
    document.getElementById('level').value = m.level;
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };
  window.deleteMember = async (id, n) => { if (confirm(`確定刪除 ${n}？`)) await remove(ref(db, 'members/' + id)); };
  function showStatus(msg) { const s = document.getElementById('status'); s.innerText = msg; s.style.display = 'block'; setTimeout(() => s.style.display = 'none', 3000); }
</script>
</body>
</html>
